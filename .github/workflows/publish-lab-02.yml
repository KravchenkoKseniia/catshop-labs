name: publish-lab-02

on:
  push:
    paths: [ "lab-02/**", ".github/workflows/publish-lab-02.yml" ]
  pull_request:
    paths: [ "lab-02/**", ".github/workflows/publish-lab-02.yml" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t catshop-lab-02:${{ github.sha }} lab-02

  publish:
    needs: [test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/catshop-lab-02" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Digest
        run: echo "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"